name: Floppy v1.2 Ginkgo A10 StockCFG

on:
  push:
    branches:
      - floppy-v1.2-ginkgo-a10-stockcfg
    paths:
      - '.github/workflows/floppy-v1.2-ginkgo-a10-stockcfg.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout trigger repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential brotli ccache cpio curl flex git \
            kmod libelf-dev libssl-dev libncurses-dev libtinfo5 \
            python3 unzip wget zip zstd xz-utils

      - name: Clone exact Floppy v1.2 source
        run: |
          set -euxo pipefail
          git clone --depth=1 --branch flop-v1.2 \
            https://github.com/FlopKernel-Series/flop_trinket-mi_kernel.git kernel
          cd kernel
          git rev-parse HEAD | tee ../FLOPPY_SOURCE_COMMIT.txt
          test -f arch/arm64/configs/ginkgo-stock_defconfig
          test -f arch/arm64/configs/vendor/xiaomi-trinket.config
          test -f arch/arm64/configs/vendor/ginkgo.config
          test -f arch/arm64/configs/ksu.config

      - name: Patch A10 source compatibility
        working-directory: kernel
        run: |
          set -euxo pipefail

          # COMMAND_LINE_SIZE is needed regardless of INITRAMFS_IGNORE_SKIP_FLAG.
          sed -i '/^#ifdef CONFIG_INITRAMFS_IGNORE_SKIP_FLAG$/,/^#endif$/c\#include <asm/setup.h>' fs/proc/cmdline.c

          # Fix the interpreter table braces exposed when BPF_JIT_ALWAYS_ON is off.
          python3 -c 'from pathlib import Path; p=Path("kernel/bpf/core.c"); s=p.read_text(); x="EVAL4(PROG_NAME_LIST, 416, 448, 480, 512)\n\n#undef PROG_NAME_LIST"; y="EVAL4(PROG_NAME_LIST, 416, 448, 480, 512)\n};\n\n#undef PROG_NAME_LIST"; assert x in s, "BPF interpreter table pattern not found"; s=s.replace(x,y,1); x2="\n}\n\n};\n\n#else\n"; y2="\n}\n\n#else\n"; assert x2 in s, "BPF stray brace pattern not found"; p.write_text(s.replace(x2,y2,1))'

          grep -n '#include <asm/setup.h>' fs/proc/cmdline.c
          sed -n '1581,1612p' kernel/bpf/core.c
          sed -i 's/static inline bool is_battery_saver_on()/static inline bool is_battery_saver_on(void)/' include/linux/battery_saver.h
          grep -n 'is_battery_saver_on' include/linux/battery_saver.h

          # Preserve the stock A10 TCP default when Floppy's modified Kconfig leaves the string unset.
          python3 -c 'from pathlib import Path; p=Path("net/ipv4/tcp_cong.c"); s=p.read_text(); m="/* Set default value from kernel configuration at bootup */"; assert m in s; p.write_text(s.replace(m, "#ifndef CONFIG_DEFAULT_TCP_CONG\n#define CONFIG_DEFAULT_TCP_CONG \"cubic\"\n#endif\n\n"+m, 1))'

          # Camera debug trace call-sites pass pointers; make trace prototypes match.
          python3 -c 'from pathlib import Path; p=Path("include/trace/events/msm_cam.h"); s=p.read_text(); s=s.replace("TP_PROTO(struct msm_vfe_irq_debug_info tasklet_state)", "TP_PROTO(struct msm_vfe_irq_debug_info *tasklet_state)", 1).replace("tasklet_state.", "tasklet_state->"); s=s.replace("TP_PROTO(struct msm_vfe_irq_debug_info ping_pong_state)", "TP_PROTO(struct msm_vfe_irq_debug_info *ping_pong_state)", 1).replace("ping_pong_state.", "ping_pong_state->"); p.write_text(s)'

          grep -n 'CONFIG_DEFAULT_TCP_CONG' net/ipv4/tcp_cong.c | tail -n 4
          grep -n 'TP_PROTO(struct msm_vfe_irq_debug_info \*' include/trace/events/msm_cam.h


      - name: Validate Android 10 stock base
        working-directory: kernel
        run: |
          set -euxo pipefail
          grep -q '^CONFIG_SCHED_TUNE=y$' arch/arm64/configs/ginkgo-stock_defconfig
          grep -q '^CONFIG_RT_GROUP_SCHED=y$' arch/arm64/configs/ginkgo-stock_defconfig
          grep -q '^CONFIG_HZ=100$' arch/arm64/configs/ginkgo-stock_defconfig
          grep -q '^# CONFIG_SCHED_WALT is not set$' arch/arm64/configs/ginkgo-stock_defconfig
          ! grep -q '^CONFIG_UCLAMP_TASK=y$' arch/arm64/configs/ginkgo-stock_defconfig

      - name: Prepare pinned clang-r563880 toolchain
        run: |
          set -euxo pipefail
          mkdir -p toolchains/aosp toolchains/gcc64 toolchains/gcc32

          wget -q --show-progress \
            https://github.com/zzh20188/ZTC-Kernel-Build/releases/download/clang/clang-r563880.tar.gz \
            -O /tmp/clang-r563880.tar.gz
          echo "cf64c238acce155ab75ffe00e9b9a6d4007b3ffd0d31598e3275e40df6830743  /tmp/clang-r563880.tar.gz" \
            | sha256sum -c -

          tar -xf /tmp/clang-r563880.tar.gz -C toolchains/aosp
          rm -f /tmp/clang-r563880.tar.gz

          git clone --depth=1 -b lineage-19.1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            toolchains/gcc64
          git clone --depth=1 -b lineage-19.1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
            toolchains/gcc32

          test -x toolchains/aosp/bin/clang
          test -x toolchains/gcc64/bin/aarch64-linux-android-gcc
          test -x toolchains/gcc32/bin/arm-linux-androideabi-gcc
          toolchains/aosp/bin/clang --version | tee clang-version.txt

      - name: Configure A10 stock + ginkgo + KernelSU Next
        working-directory: kernel
        run: |
          set -euxo pipefail
          mkdir -p out diagnostics

          timeout 5m make O=out ARCH=arm64 ginkgo-stock_defconfig \
            2>&1 | tee diagnostics/config-base.log

          scripts/config --file out/.config --enable OVERLAY_FS
          scripts/config --file out/.config --disable OVERLAY_FS_REDIRECT_DIR
          scripts/config --file out/.config --disable OVERLAY_FS_INDEX
          scripts/config --file out/.config --disable SECURITY_SMACK
          scripts/config --file out/.config --set-val LITTLE_CPU_MASK 15
          scripts/config --file out/.config --set-val BIG_CPU_MASK 240
          scripts/config --file out/.config --set-val BIG_CPU_FIRST_MASK 0
          scripts/config --file out/.config --set-val BIG_CPU_SECOND_MASK 0

          timeout 5m scripts/kconfig/merge_config.sh -m -O out \
            out/.config \
            arch/arm64/configs/vendor/xiaomi-trinket.config \
            arch/arm64/configs/vendor/ginkgo.config \
            arch/arm64/configs/ksu.config \
            2>&1 | tee diagnostics/config-merge.log

          timeout 5m make O=out ARCH=arm64 olddefconfig \
            2>&1 | tee diagnostics/config-olddefconfig.log

          scripts/config --file out/.config --set-val LOCALVERSION '"-Floppy-v1.2-KN-A10/"'
          scripts/config --file out/.config --disable LOCALVERSION_AUTO

          grep -q '^CONFIG_SCHED_TUNE=y$' out/.config
          grep -q '^CONFIG_RT_GROUP_SCHED=y$' out/.config
          grep -q '^CONFIG_HZ=100$' out/.config
          grep -q '^CONFIG_OVERLAY_FS=y$' out/.config
          grep -q '^CONFIG_LITTLE_CPU_MASK=15$' out/.config
          grep -q '^CONFIG_BIG_CPU_MASK=240$' out/.config
          grep -q '^CONFIG_KSU=y$' out/.config
          grep -q '^# CONFIG_SECURITY_SMACK is not set$' out/.config
          ! grep -q '^CONFIG_UCLAMP_TASK=y$' out/.config

          cp out/.config diagnostics/kernel.config
          {
            echo "CONFIG_OK"
            grep -E '^(CONFIG_(SCHED_TUNE|RT_GROUP_SCHED|HZ|OVERLAY_FS|KSU)=|# CONFIG_UCLAMP_TASK)' out/.config || true
          } | tee diagnostics/config-summary.txt

      - name: Compile Image.gz-dtb
        id: compile
        working-directory: kernel
        continue-on-error: true
        run: |
          set +e
          set -o pipefail

          export PATH="$GITHUB_WORKSPACE/toolchains/aosp/bin:$GITHUB_WORKSPACE/toolchains/gcc64/bin:$GITHUB_WORKSPACE/toolchains/gcc32/bin:$PATH"
          export LLVM=1
          export LLVM_IAS=1
          export ARCH=arm64
          export KBUILD_BUILD_USER=riwutz
          export KBUILD_BUILD_HOST=github

          make -j"$(nproc)" O=out \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            READELF=llvm-readelf \
            OBJSIZE=llvm-size \
            OBJDUMP=llvm-objdump \
            OBJCOPY=llvm-objcopy \
            STRIP=llvm-strip \
            NM=llvm-nm \
            AR=llvm-ar \
            HOSTAR=llvm-ar \
            HOSTAS=llvm-as \
            HOSTNM=llvm-nm \
            LD=ld.lld \
            Image.gz-dtb 2>&1 | tee diagnostics/build.log

          rc=${PIPESTATUS[0]}
          echo "$rc" | tee diagnostics/build.exit

          {
            echo "===== FIRST ERROR CANDIDATES ====="
            grep -nEi 'error:|fatal error:|undefined reference|ld\.lld: error|make(\[[0-9]+\])?: \*\*\*' diagnostics/build.log | head -n 160 || true
            echo "===== LAST 350 LINES ====="
            tail -n 350 diagnostics/build.log || true
          } > diagnostics/first-error.txt

          if [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi

          test -s out/arch/arm64/boot/Image.gz-dtb
          cp out/arch/arm64/boot/Image.gz-dtb diagnostics/Image.gz-dtb
          sha256sum out/arch/arm64/boot/Image.gz-dtb | tee diagnostics/Image.gz-dtb.sha256

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Floppy-A10-Build-Diagnostics
          path: kernel/diagnostics/*
          if-no-files-found: warn
          retention-days: 30

      - name: Stop on compile failure
        if: steps.compile.outcome != 'success'
        run: |
          echo "Compile failed. Diagnostics artifact is available."
          exit 1

      - name: Package Android 10 boot-only ZIP
        if: steps.compile.outcome == 'success'
        run: |
          set -euxo pipefail
          rm -rf AnyKernel3 output
          mkdir -p output

          git clone --depth=1 --branch floppy-reborn \
            https://github.com/Flopster101/AnyKernel3.git AnyKernel3
          rm -rf AnyKernel3/.git
          rm -f AnyKernel3/Image* AnyKernel3/dtbo.img AnyKernel3/README.md

          cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb
          cp kernel/out/arch/arm64/boot/dts/xiaomi/qcom-base/trinket.dtb AnyKernel3/dtb

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("AnyKernel3/anykernel.sh")
          s = p.read_text()

          s = re.sub(r"supported\.versions=.*", "supported.versions=10", s)
          s = re.sub(r"(?m)^\s*flash_dtbo;?\s*$", "", s)

          s = re.sub(
              r'if \[ "\$ROM_CODENAME" = "HyperMINT" \]; then.*?fi',
              'ui_print "Android 10 mode: uname BPF spoof disabled";\npatch_cmdline "uname_bpf_spoof" "uname_bpf_spoof=0"',
              s,
              flags=re.S,
          )

          s = re.sub(
              r'# Enable legacy timestamp source for A11 and below.*?fi',
              '# Android 10 legacy timestamp source\npatch_cmdline "legacy_timestamp_source" "legacy_timestamp_source=1"',
              s,
              flags=re.S,
          )

          marker = '. tools/ak3-core.sh;'
          if marker in s:
              s = s.replace(
                  marker,
                  marker + '\n\nui_print " ";\nui_print " Floppy v1.2 A10 STOCKCFG - ginkgo";\nui_print " 4.14.364 + KernelSU Next | DTBO preserved";\nui_print " ";',
                  1,
              )

          p.write_text(s)
          PY

          grep -q 'supported.versions=10' AnyKernel3/anykernel.sh
          ! grep -Eq '^[[:space:]]*flash_dtbo;?[[:space:]]*$' AnyKernel3/anykernel.sh
          test ! -e AnyKernel3/dtbo.img
          test -s AnyKernel3/Image.gz-dtb
          test -s AnyKernel3/dtb
          test -s AnyKernel3/tools/ak3-core.sh

          (
            cd AnyKernel3
            zip -r9 ../output/Floppy_v1.2-KSUNext-ginkgo-A10-STOCKCFG-FINAL.zip . \
              -x '*.git*' README.md '*placeholder*'
          )

          unzip -t output/Floppy_v1.2-KSUNext-ginkgo-A10-STOCKCFG-FINAL.zip
          sha256sum output/Floppy_v1.2-KSUNext-ginkgo-A10-STOCKCFG-FINAL.zip \
            | tee output/SHA256SUMS.txt

          cp kernel/out/.config output/kernel.config
          cp kernel/diagnostics/first-error.txt output/build-diagnostics.txt

          {
            echo "Device: Redmi Note 8 / 8T (ginkgo/willow)"
            echo "Target: Android 10"
            echo "Source: FloppyKernel v1.2 / Linux 4.14.364"
            echo "Base config: ginkgo-stock_defconfig + Xiaomi/ginkgo fragments"
            echo "Scheduler: legacy SCHED_TUNE / HZ100 / no UCLAMP"
            echo "Root: KernelSU Next from Floppy v1.2 source"
            echo "Compiler: clang-r563880"
            echo "Installer: AnyKernel3 boot-only"
            echo "DTBO: preserved"
            echo -n "Source commit: "
            cat FLOPPY_SOURCE_COMMIT.txt
          } | tee output/BUILD-INFO.txt

      - name: Upload FINAL kernel
        if: steps.compile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Floppy-v1.2-KSUNext-ginkgo-A10-STOCKCFG-FINAL
          path: output/*
          if-no-files-found: error
          retention-days: 30
