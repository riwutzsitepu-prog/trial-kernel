name: Floppy v2.0b Ginkgo A10 FAST

on:
  push:
    branches:
      - floppy-v2-a10-fastboot
    paths:
      - '.github/workflows/floppy-v2-a10-fastboot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout trigger repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential brotli ccache cpio curl flex git \
            kmod libelf-dev libssl-dev libncurses-dev libtinfo5 \
            python3 unzip wget zip zstd xz-utils

      - name: Clone exact Floppy v2.0b source
        run: |
          set -euxo pipefail
          mkdir kernel
          cd kernel
          git init
          git remote add origin https://github.com/FlopKernel-Series/flop_trinket-mi_kernel.git
          git fetch --depth=1 origin c318f003c0bd9f9ef7b6bf4b1f06974c57b4cd32
          git checkout --detach FETCH_HEAD
          git rev-parse HEAD | tee ../FLOPPY_V2_SOURCE_COMMIT.txt

      - name: Patch source for Android 10 stock config
        working-directory: kernel
        run: |
          set -euxo pipefail

          sed -i '/^#ifdef CONFIG_INITRAMFS_IGNORE_SKIP_FLAG$/,/^#endif$/c\#include <asm/setup.h>' fs/proc/cmdline.c
          sed -i 's/static inline bool is_battery_saver_on()/static inline bool is_battery_saver_on(void)/' include/linux/battery_saver.h

          python3 - <<'PY'
          from pathlib import Path

          p = Path("net/ipv4/tcp_cong.c")
          s = p.read_text()
          marker = "/* Set default value from kernel configuration at bootup */"
          if "#ifndef CONFIG_DEFAULT_TCP_CONG" not in s and marker in s:
              s = s.replace(
                  marker,
                  '#ifndef CONFIG_DEFAULT_TCP_CONG\n#define CONFIG_DEFAULT_TCP_CONG "cubic"\n#endif\n\n' + marker,
                  1,
              )
          p.write_text(s)

          p = Path("kernel/bpf/core.c")
          s = p.read_text()
          x = "EVAL4(PROG_NAME_LIST, 416, 448, 480, 512)\n\n#undef PROG_NAME_LIST"
          if x in s:
              s = s.replace(
                  x,
                  "EVAL4(PROG_NAME_LIST, 416, 448, 480, 512)\n};\n\n#undef PROG_NAME_LIST",
                  1,
              )
          x2 = "\n}\n\n};\n\n#else\n"
          if x2 in s:
              s = s.replace(x2, "\n}\n\n#else\n", 1)
          p.write_text(s)

          p = Path("drivers/media/platform/msm/camera_v2/isp/msm_isp_util.c")
          s = p.read_text()
          s = s.replace(
              "trace_msm_cam_ping_pong_debug_dump(\n\t\t\tvfe_dev->common_data->vfe_irq_dump.irq_debug[",
              "trace_msm_cam_ping_pong_debug_dump(\n\t\t\t&vfe_dev->common_data->vfe_irq_dump.irq_debug[",
              1,
          )
          s = s.replace(
              "trace_msm_cam_tasklet_debug_dump(\n\t\t\tvfe_dev->common_data->vfe_irq_dump.tasklet_debug[",
              "trace_msm_cam_tasklet_debug_dump(\n\t\t\t&vfe_dev->common_data->vfe_irq_dump.tasklet_debug[",
              1,
          )
          p.write_text(s)
          PY

      - name: Prepare pinned clang-r563880
        run: |
          set -euxo pipefail
          mkdir -p toolchains/aosp toolchains/gcc64 toolchains/gcc32

          wget -q --show-progress \
            https://github.com/zzh20188/ZTC-Kernel-Build/releases/download/clang/clang-r563880.tar.gz \
            -O /tmp/clang-r563880.tar.gz
          echo "cf64c238acce155ab75ffe00e9b9a6d4007b3ffd0d31598e3275e40df6830743  /tmp/clang-r563880.tar.gz" \
            | sha256sum -c -
          tar -xf /tmp/clang-r563880.tar.gz -C toolchains/aosp
          rm -f /tmp/clang-r563880.tar.gz

          git clone --depth=1 -b lineage-19.1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            toolchains/gcc64
          git clone --depth=1 -b lineage-19.1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
            toolchains/gcc32

          test -x toolchains/aosp/bin/clang
          toolchains/aosp/bin/clang --version | head -n1

      - name: Configure Android 10 FAST kernel
        working-directory: kernel
        run: |
          set -euxo pipefail
          mkdir -p out diagnostics

          make O=out ARCH=arm64 \
            ginkgo-stock_defconfig \
            vendor/xiaomi-trinket.config \
            vendor/ginkgo.config \
            ksu.config \
            droidspaces.config \
            2>&1 | tee diagnostics/configure.log

          scripts/config --file out/.config --disable SECURITY_SMACK
          scripts/config --file out/.config --set-val LITTLE_CPU_MASK 15
          scripts/config --file out/.config --set-val BIG_CPU_MASK 240
          scripts/config --file out/.config --set-val BIG_CPU_FIRST_MASK 0
          scripts/config --file out/.config --set-val BIG_CPU_SECOND_MASK 0

          scripts/config --file out/.config --enable SCHED_TUNE
          scripts/config --file out/.config --disable SCHED_WALT
          scripts/config --file out/.config --disable SCHED_TUNE_DUMMY
          scripts/config --file out/.config --disable UCLAMP_TASK
          scripts/config --file out/.config --disable UCLAMP_TASK_GROUP
          scripts/config --file out/.config --disable UCLAMP_ASSIST

          scripts/config --file out/.config --enable HZ_100
          scripts/config --file out/.config --disable HZ_250
          scripts/config --file out/.config --disable HZ_300
          scripts/config --file out/.config --disable HZ_1000
          scripts/config --file out/.config --set-val HZ 100

          scripts/config --file out/.config --enable BPF_JIT
          scripts/config --file out/.config --enable BPF_JIT_ALWAYS_ON
          scripts/config --file out/.config --enable BPF_JIT_DEFAULT_ON

          scripts/config --file out/.config --enable OVERLAY_FS
          scripts/config --file out/.config --enable KSU
          scripts/config --file out/.config --enable KSU_NEXT
          scripts/config --file out/.config --enable KSU_SUSFS
          scripts/config --file out/.config --disable KSU_SUSFS_ENABLE_LOG

          scripts/config --file out/.config --set-val LOCALVERSION '"-Floppy-v2.0b-KN-SUSFS-A10FAST"'
          scripts/config --file out/.config --disable LOCALVERSION_AUTO

          make O=out ARCH=arm64 olddefconfig 2>&1 | tee diagnostics/olddefconfig.log

          grep -q '^CONFIG_SCHED_TUNE=y$' out/.config
          grep -q '^# CONFIG_SCHED_WALT is not set$' out/.config
          grep -q '^# CONFIG_UCLAMP_TASK is not set$' out/.config
          grep -q '^CONFIG_HZ=100$' out/.config
          grep -q '^CONFIG_BPF_JIT=y$' out/.config
          grep -q '^CONFIG_BPF_JIT_ALWAYS_ON=y$' out/.config
          grep -q '^CONFIG_KSU=y$' out/.config
          grep -q '^CONFIG_KSU_SUSFS=y$' out/.config
          grep -q '^# CONFIG_KSU_SUSFS_ENABLE_LOG is not set$' out/.config
          grep -q '^# CONFIG_SECURITY_SMACK is not set$' out/.config

          cp out/.config diagnostics/kernel.config

      - name: Compile Image.gz-dtb A10 FAST
        working-directory: kernel
        run: |
          set -euxo pipefail

          export PATH="$GITHUB_WORKSPACE/toolchains/aosp/bin:$GITHUB_WORKSPACE/toolchains/gcc64/bin:$GITHUB_WORKSPACE/toolchains/gcc32/bin:$PATH"
          export LLVM=1
          export LLVM_IAS=1
          export ARCH=arm64
          export KBUILD_BUILD_USER=riwutz
          export KBUILD_BUILD_HOST=github

          make -j"$(nproc)" O=out \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            READELF=llvm-readelf \
            OBJSIZE=llvm-size \
            OBJDUMP=llvm-objdump \
            OBJCOPY=llvm-objcopy \
            STRIP=llvm-strip \
            NM=llvm-nm \
            AR=llvm-ar \
            HOSTAR=llvm-ar \
            HOSTAS=llvm-as \
            HOSTNM=llvm-nm \
            LD=ld.lld \
            Image.gz-dtb 2>&1 | tee diagnostics/build.log

          test -s out/arch/arm64/boot/Image.gz-dtb
          cp out/arch/arm64/boot/Image.gz-dtb diagnostics/Image.gz-dtb
          sha256sum diagnostics/Image.gz-dtb | tee diagnostics/Image.gz-dtb.sha256

          {
            echo "Source: Floppy v2.0b commit c318f003c0bd9f9ef7b6bf4b1f06974c57b4cd32"
            echo "Target: Redmi Note 8/8T ginkgo Android 10"
            echo "Scheduler: SCHED_TUNE legacy"
            echo "SCHED_WALT: OFF"
            echo "UCLAMP: OFF"
            echo "HZ: 100"
            echo "BPF JIT: ON"
            echo "KernelSU Next + SUSFS: ON"
            echo "SUSFS logging: OFF"
            echo "Packaging strategy: reuse known-working v2.0b DTB/DTBO/AnyKernel package"
          } > diagnostics/BUILD-INFO.txt

      - name: Upload compiled A10 FAST image
        uses: actions/upload-artifact@v4
        with:
          name: Floppy-v2.0b-ginkgo-A10-FAST-Image
          path: kernel/diagnostics/*
          if-no-files-found: error
          retention-days: 30
