name: Repair donor repro config

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-donor-repro-config.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore valid workflow and patch only Kconfig resolution
        shell: bash
        run: |
          set -euxo pipefail
          TARGET=.github/workflows/mode-cloning-donor-repro-12701.yml
          git show 86359728c25c9cf6389bbba64528f1cdf9808fa2:$TARGET > "$TARGET"
          python3 - <<'PY'
          import base64
          from pathlib import Path
          p=Path('.github/workflows/mode-cloning-donor-repro-12701.yml')
          s=p.read_text()
          old=base64.b64decode('').decode()
          new=base64.b64decode('').decode()
          if old not in s:
              raise SystemExit('expected original configure block not found')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$TARGET"
          git commit -m 'fix: resolve donor-era Kconfig defaults before compile'
          git push origin HEAD:main
